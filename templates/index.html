<!DOCTYPE html>
<html>
<head>
<title>TOOL-H PRO MAX</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🚀 TOOL-H PRO MAX</h1>

<h2>💻 System Info</h2>
<pre>{{ system }}</pre>

<h2>📡 Network Devices</h2>
<ul>
{% for d in devices %}
<li>{{ d.ip }} - {{ d.status }}</li>
{% endfor %}
</ul>

<h2>🧠 AI Assistant</h2>
<form method="post">
<input name="query" placeholder="Ask AI">
<button>Ask</button>
</form>
<p>{{ ai }}</p>

<h2>🔐 Password Checker</h2>
<form method="post">
<input name="password" placeholder="Enter password">
<button>Check</button>
</form>
<p>{{ password }}</p>

</body>
</html>
